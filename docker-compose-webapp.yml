version: '3.8'

services:
  # Enhanced Web Application with WebSocket support
  subtitle-webapp-enhanced:
    build:
      context: .
      dockerfile: Dockerfile.enhanced
    container_name: subtitle-webapp-enhanced
    ports:
      - "5050:5050"
    environment:
      # Application Settings
      - SECRET_KEY=${SECRET_KEY:-enhanced-secret-key}
      - FLASK_ENV=${FLASK_ENV:-production}
      - DEBUG=${DEBUG:-false}
      - PORT=5050
      
      # Whisper Configuration
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-base}
      - WHISPER_CACHE_DIR=/app/cache/whisper
      
      # Processing Settings
      - DEFAULT_LANGUAGES=${DEFAULT_LANGUAGES:-vietnamese,chinese,korean,french,spanish,japanese}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-1GB}
      - CACHE_EXPIRE_HOURS=${CACHE_EXPIRE_HOURS:-168}
      - MAX_PARALLEL_WORKERS=${MAX_PARALLEL_WORKERS:-8}
      
      # Performance Optimizations
      - ENABLE_GPU=${ENABLE_GPU:-false}
      - WORKERS=${WORKERS:-4}
      - WORKER_CONNECTIONS=${WORKER_CONNECTIONS:-1000}
      - TIMEOUT=${TIMEOUT:-600}
      
      # WebSocket Settings
      - SOCKETIO_ASYNC_MODE=threading
      - SOCKETIO_LOGGER=${SOCKETIO_LOGGER:-true}
      
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENABLE_PERFORMANCE_LOGGING=${ENABLE_PERFORMANCE_LOGGING:-true}
      
      # Timezone
      - TZ=Asia/Ho_Chi_Minh
      
    volumes:
      # Application directories with proper permissions
      - ./uploads:/app/uploads:rw
      - ./output:/app/output:rw
      - ./cache:/app/cache:rw
      - ./temp:/app/temp:rw
      - ./logs:/app/logs:rw
      
      # Whisper model cache (persistent across restarts)
      - whisper-models:/home/appuser/.cache/whisper:rw
      
      # Enhanced configuration
      - ./config:/app/config:ro
      
    networks:
      - enhanced-network
    
    restart: unless-stopped
    
    # Health check with WebSocket support
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/api/stats"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    
    # Enhanced resource limits for better performance
    deploy:
      resources:
        limits:
          memory: 12G
          cpus: '6.0'
        reservations:
          memory: 4G
          cpus: '2.0'
    
    # Logging configuration for better Docker log visibility
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=subtitle-webapp"
    
    depends_on:
      - redis-enhanced
      - postgres-enhanced

  # Enhanced Redis with optimized configuration
  redis-enhanced:
    image: redis:7-alpine
    container_name: subtitle-redis-enhanced
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - enhanced-network
    restart: unless-stopped
    
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --appendonly yes
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  # PostgreSQL for persistent storage and analytics
  postgres-enhanced:
    image: postgres:15-alpine
    container_name: subtitle-postgres-enhanced
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-subtitle_enhanced_db}
      POSTGRES_USER: ${POSTGRES_USER:-subtitle_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_enhanced_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./config/postgres/performance.sql:/docker-entrypoint-initdb.d/02-performance.sql:ro
    ports:
      - "5432:5432"
    networks:
      - enhanced-network
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-subtitle_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # Enhanced Nginx with WebSocket support
  nginx-enhanced:
    image: nginx:alpine
    container_name: subtitle-nginx-enhanced
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx-enhanced.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - ./output:/usr/share/nginx/html/downloads:ro
      - ./static:/usr/share/nginx/html/static:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx:rw
    networks:
      - enhanced-network
    restart: unless-stopped
    depends_on:
      - subtitle-webapp-enhanced
    profiles:
      - proxy
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Enhanced File Manager with better UI
  filebrowser-enhanced:
    image: filebrowser/filebrowser:latest
    container_name: subtitle-filebrowser-enhanced
    ports:
      - "8080:80"
    volumes:
      - ./uploads:/srv/uploads
      - ./output:/srv/output
      - ./cache:/srv/cache
      - ./logs:/srv/logs:ro
      - ./config/filebrowser.db:/database/filebrowser.db
      - ./config/filebrowser-enhanced.json:/config/settings.json:ro
    environment:
      - FB_DATABASE=/database/filebrowser.db
      - FB_CONFIG=/config/settings.json
      - FB_NOAUTH=${FB_NOAUTH:-false}
    networks:
      - enhanced-network
    restart: unless-stopped
    profiles:
      - management

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: subtitle-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/monitoring/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - enhanced-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: subtitle-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
    networks:
      - enhanced-network
    restart: unless-stopped
    depends_on:
      - prometheus
    profiles:
      - monitoring

  # Background Worker for heavy processing
  worker-enhanced:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: subtitle-worker-enhanced
    environment:
      - WORKER_TYPE=heavy_processing
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-base}
      - REDIS_URL=redis://redis-enhanced:6379/0
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-4}
      - ENABLE_GPU=${ENABLE_GPU:-false}
    volumes:
      - ./uploads:/app/uploads:rw
      - ./output:/app/output:rw
      - ./cache:/app/cache:rw
      - ./temp:/app/temp:rw
      - whisper-models:/home/appuser/.cache/whisper:rw
    networks:
      - enhanced-network
    restart: unless-stopped
    depends_on:
      - redis-enhanced
    profiles:
      - worker
    
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'

  # Log aggregation with ELK stack (optional)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: subtitle-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - enhanced-network
    restart: unless-stopped
    profiles:
      - logging

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: subtitle-logstash
    volumes:
      - ./config/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./logs:/app/logs:ro
    ports:
      - "5044:5044"
    networks:
      - enhanced-network
    restart: unless-stopped
    depends_on:
      - elasticsearch
    profiles:
      - logging

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: subtitle-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - enhanced-network
    restart: unless-stopped
    depends_on:
      - elasticsearch
    profiles:
      - logging

# Enhanced networking
networks:
  enhanced-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.22.0.0/16
          gateway: 172.22.0.1
    driver_opts:
      com.docker.network.bridge.name: subtitle-bridge

# Persistent volumes with labels
volumes:
  whisper-models:
    driver: local
    labels:
      - "com.subtitle.type=models"
      - "com.subtitle.backup=false"
  
  redis-data:
    driver: local
    labels:
      - "com.subtitle.type=cache"
      - "com.subtitle.backup=true"
  
  postgres-data:
    driver: local
    labels:
      - "com.subtitle.type=database"
      - "com.subtitle.backup=true"
  
  prometheus-data:
    driver: local
    labels:
      - "com.subtitle.type=monitoring"
      - "com.subtitle.backup=true"
  
  grafana-data:
    driver: local
    labels:
      - "com.subtitle.type=monitoring"
      - "com.subtitle.backup=true"
  
  elasticsearch-data:
    driver: local
    labels:
      - "com.subtitle.type=logs"
      - "com.subtitle.backup=false"